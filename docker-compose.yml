version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: compo_postres
    restart: always
    environment:
      POSTGRES_USER: compo
      POSTGRES_PASSWORD: compo
      POSTGRES_DB: compo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5444:5432"

volumes:
  postgres_data:

